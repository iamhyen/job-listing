<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOB LISTING – Việc làm Hà Nội, Quảng Ninh, Hải Phòng</title>
<meta name="description" content="Khám phá việc làm, mở ra cơ hội mới tại đây. Việc làm cập nhật thường xuyên ở Hà Nội, Quảng Ninh, Hải Phòng.">
<meta property="og:title" content="JOB LISTING">
<meta property="og:description" content="Việc làm được cập nhật thường xuyên ở Hà Nội, Quảng Ninh, Hải Phòng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: thanh điều hướng + dải tìm kiếm màu biển; trang chủ (ngành nghề, việc nổi bật, nhà tuyển dụng), trang kết quả có bộ lọc bên trái, trang chi tiết 2 cột, trang nhà tuyển dụng để đăng tin */
:root{
  --bg:#f2f5f5; --surface:#ffffff; --fg:#13262a; --muted:#5b6e72; --line:#d9e2e2;
  --accent:#0b6b6b; --accent-2:#0a5555; --accent-ink:#ffffff; --accent-soft:#dcefed; --warm:#c45f1c; --warm-soft:#fbeadc; --tint-c:#ebe8f7; --tint-c-ink:#4b3f8f;
  --display:"Lexend",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e191a; --surface:#152325; --fg:#e3eded; --muted:#99adaf; --line:#253839;
  --accent:#49bfb4; --accent-2:#0f3b3a; --accent-ink:#04201d; --accent-soft:#163836; --warm:#f2a35f; --warm-soft:#3a2615; --tint-c:#25213b; --tint-c-ink:#bdb3f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191a; --surface:#152325; --fg:#e3eded; --muted:#99adaf; --line:#253839;
  --accent:#49bfb4; --accent-2:#0f3b3a; --accent-ink:#04201d; --accent-soft:#163836; --warm:#f2a35f; --warm-soft:#3a2615; --tint-c:#25213b; --tint-c-ink:#bdb3f2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:21px;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:34px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:15px}
.nav nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}.lang button{border:0;background:transparent;padding:6px 10px;font:600 13px/1 var(--display);letter-spacing:.04em;color:var(--muted);cursor:pointer}.lang button+button{border-left:1px solid var(--line)}.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav nav a{text-decoration:none;padding:6px 12px;border-radius:6px;font-weight:500;font-size:14.5px;color:var(--muted)}
.nav nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#c0392b;border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
/* hero */
.hero{background:var(--accent-2);color:#fff}
:root:not([data-theme="dark"]) .hero{background:var(--accent-2)}
.hero .wrap{padding-block:40px 44px;display:grid;gap:14px}
.hero h1{font-family:var(--display);font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0;text-wrap:balance;color:#fff}
.hero p{margin:0;color:#cfe6e4;max-width:60ch}
.search{display:grid;grid-template-columns:1fr 220px auto;gap:8px;background:var(--surface);padding:8px;border-radius:12px;margin-top:6px}
.search input,.search select{border:0;background:transparent;padding:10px 12px;min-width:0;color:var(--fg)}
.search select{border-left:1px solid var(--line)}
.search .btn{padding-inline:22px}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:#cfe6e4}
.stats b{color:#fff;font-family:var(--display);font-size:18px;margin-right:4px;font-variant-numeric:tabular-nums}
/* sections */
main{min-height:60vh}
.section{padding-block:30px;display:grid;gap:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.25}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:14px;background:none;border:0;cursor:pointer;padding:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.cat b{font-weight:600}
.cat span{font-size:13px;color:var(--muted)}
.cat:hover{border-color:var(--accent)}
.grid-jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:52px 1fr;gap:14px;text-decoration:none;align-items:start;position:relative}
.card:hover{border-color:var(--accent)}
.logo{width:52px;height:52px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;background:var(--accent-soft);color:var(--accent)}
.card-body{min-width:0;display:grid;gap:3px}
.card h3{font-size:16px;margin:0;line-height:1.35;font-weight:600}
.company{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12.5px;padding:2px 9px;border-radius:5px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.salary{background:var(--warm-soft);color:var(--warm);border-color:transparent;font-weight:600;font-variant-numeric:tabular-nums}
.badge-hot{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warm)}
.emps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.emp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.emp div{min-width:0}
.emp b{display:block;font-size:14.5px;line-height:1.35}
.emp span{font-size:13px;color:var(--muted)}
/* results */
.results{display:grid;grid-template-columns:250px 1fr;gap:22px;padding-block:24px 40px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px;position:sticky;top:76px}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}
.filters legend{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.filters label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.list{display:grid;gap:10px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list-head select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:32px;text-align:center;color:var(--muted)}
/* detail */
.crumb{font-size:13.5px;color:var(--muted);padding-top:18px}
.crumb a{color:var(--accent);text-decoration:none}
.detail{display:grid;grid-template-columns:1fr 320px;gap:22px;padding-block:14px 40px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.job-title{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center}
.job-title .logo{width:64px;height:64px;font-size:20px}
.job-title h1{font-family:var(--display);font-size:clamp(21px,3.5vw,27px);margin:0;line-height:1.25;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;border-block:1px solid var(--line);padding-block:14px}
.facts div{display:grid}
.facts small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts b{font-weight:600;font-variant-numeric:tabular-nums}
.facts .money{color:var(--warm)}
.panel h3{font-size:16px;margin:0;font-family:var(--display);font-weight:600}
.panel ul{margin:0;padding-left:20px;display:grid;gap:4px}
.apply-sec{border-top:2px solid var(--accent);padding-top:18px;margin-top:6px;display:grid;gap:12px;scroll-margin-top:80px}
.apply-sec h2{font-size:20px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.copy-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copy-row b{min-width:0;overflow-wrap:anywhere;flex:1}
.copy-row .note{width:56px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}
.privacy{font-size:13px;line-height:1.55;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.privacy b{color:var(--fg);font-weight:600}
.quick-box{border:2px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:18px;display:grid;gap:12px;scroll-margin-top:80px}
.quick-box h2{font-size:22px}
.quick-box .lead{margin:0;font-size:15.5px}
.qf{display:grid;gap:12px}
.qf label{display:grid;gap:6px;font-size:15px;font-weight:600;color:var(--fg)}
.qf input,.qf select{font-size:17px;min-height:50px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.qf .btn{min-height:54px;font-size:17px}
.qf-err{color:#c0392b;font-weight:600;margin:0}
.qf-ok{background:var(--surface);border-radius:10px;padding:16px;display:grid;gap:6px;text-align:center}
.qf-ok b{font-size:19px;font-family:var(--display);color:var(--accent)}
.quick-home{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);column-gap:28px;align-items:start}
.quick-home .qh-text{display:grid;gap:8px}
.quick-home .privacy{grid-column:1/-1}
.quick-home .qf{grid-template-columns:1fr 1fr}
.quick-home .qf label:first-child,.quick-home .qf .qf-err,.quick-home .qf .btn{grid-column:1/-1}
@media (max-width:760px){.quick-home{grid-template-columns:minmax(0,1fr)}.quick-home .qf{grid-template-columns:minmax(0,1fr)}}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.st-open{background:var(--accent-soft);color:var(--accent)}
.st-urgent{background:var(--warm);color:#fff}
.st-closed{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card.is-closed{opacity:.62}
.card.is-closed:hover{border-color:var(--line)}
.closed-note{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:0}
.closed-note a{color:var(--accent);font-weight:600}

/* blog + AI */
.phero{background:var(--surface);border-bottom:1px solid var(--line)}
.phero .wrap{padding-block:34px 26px;display:grid;gap:10px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.phero h1{font-family:var(--display);font-size:clamp(26px,4.4vw,38px);line-height:1.18;margin:0;text-wrap:balance;max-width:24ch}
.phero p{margin:0;color:var(--muted);max-width:62ch;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.cover{border-radius:10px;display:flex;align-items:flex-end;padding:16px;min-height:150px;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.01em}
.cv-a{background:var(--accent-soft);color:var(--accent)}
.cv-b{background:var(--warm-soft);color:var(--warm)}
.cv-c{background:var(--tint-c);color:var(--tint-c-ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;text-decoration:none;align-content:start}
.pcard:hover{border-color:var(--accent)}
.pcard h3{margin:0;font-size:17px;line-height:1.35;font-weight:600;text-wrap:balance}
.pcard p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.pmeta .cat{font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;background:none;border:0;padding:0}
.tag{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}
.sample-tag{font-size:11.5px;font-weight:700;color:var(--warm)}
.feat{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;margin-bottom:6px}
.feat:hover{border-color:var(--accent)}
.feat .cover{min-height:240px;font-size:44px}
.feat .ftext{display:grid;gap:10px;align-content:center;padding:8px 8px 8px 0}
.feat h2{font-size:clamp(21px,3vw,27px);text-wrap:balance}
.feat p{margin:0;color:var(--muted)}
.post{max-width:760px;margin:0 auto;padding-block:8px 48px;display:grid;gap:18px}
.post header{display:grid;gap:10px}
.post h1{font-family:var(--display);font-size:clamp(26px,4.6vw,38px);line-height:1.2;margin:0;text-wrap:balance}
.post .lead{font-size:18px;color:var(--muted);margin:0}
.post .cover{min-height:150px;font-size:44px}
.prose{display:grid;gap:14px;font-size:16.5px;line-height:1.75}
.prose h2{font-size:21px;margin-top:10px}
.prose p,.prose ul,.prose ol{margin:0}
.prose ul,.prose ol{padding-left:22px;display:grid;gap:6px}
.tipbox{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-size:15.5px}
.tipbox b{display:block;font-family:var(--display);color:var(--accent);margin-bottom:2px}
.promptbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.promptbox .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.promptbox pre{margin:0;padding:14px 16px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;overflow-x:auto}
.author{display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:18px}
.author .logo{width:48px;height:48px;font-size:15px;flex:none}
.author p{margin:0;color:var(--muted);font-size:14px}
.post-cta{background:var(--accent-2);color:#fff;border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.post-cta b{font-family:var(--display);font-size:19px}
.post-cta p{margin:2px 0 0;color:#cfe6e4;font-size:14px}
.post-cta .btn{background:#fff;color:var(--accent-2)}
@media (max-width:760px){.feat{grid-template-columns:minmax(0,1fr)}.feat .cover{min-height:120px;font-size:34px}.feat .ftext{padding:4px}.cover{min-height:110px;font-size:26px}.post .cover{min-height:110px;font-size:32px}}
@media (max-width:620px){.nav nav a{padding:6px 9px;font-size:14px}}
.pill.nocv{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.worker{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:18px;display:grid;gap:12px}
.worker h2{font-size:21px}
.worker p{margin:0;color:var(--muted)}
.worker .areas{display:flex;gap:10px;flex-wrap:wrap}
.worker .areas a{flex:1 1 150px;text-align:center;min-height:52px;font-size:16px}
.btn.big{padding:12px 26px;font-size:15.5px}
.side{display:grid;gap:14px;position:sticky;top:76px}
.note{font-size:13px;color:var(--muted);margin:0}
form.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
form.grid .full{grid-column:1/-1}
.fld{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14.5px;min-width:0;width:100%}
.fld.check{display:flex;align-items:center;gap:8px;color:var(--fg)}
.fld.check input{width:auto}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;margin:0;font-family:var(--body);font-size:14px;user-select:all}
.alert{padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:14px}
.alert.err{background:var(--warm-soft)}
.mini-list{display:grid;gap:8px}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.mini div{min-width:0}
.mini b{display:block;font-size:14.5px}
.mini span{font-size:13px;color:var(--muted)}
.mini .acts{display:flex;gap:6px}
footer{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:12px 32px;flex-wrap:wrap}
.f-brand,.f-contact{display:grid;gap:4px;min-width:0}
.f-brand b{color:var(--fg);font-family:var(--display);letter-spacing:.02em}
.f-contact b{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.sample{font-size:12.5px;background:var(--warm-soft);color:var(--warm);padding:6px 0;text-align:center;font-weight:500}
.groups{display:grid;gap:14px;margin-top:10px}
.gintro{display:grid;gap:6px;margin-top:6px;max-width:72ch;color:var(--muted);font-size:15px}.gintro p{margin:0}.gintro .gfree{color:var(--fg);font-weight:600}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{display:grid;grid-template-columns:44px minmax(0,1fr);grid-template-rows:1fr auto;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--net);border-radius:12px;padding:16px;text-decoration:none;color:var(--fg)}
.gcard:hover{border-color:var(--net)}
.gico{width:44px;height:44px;border-radius:10px;background:var(--net);display:grid;place-items:center;grid-row:1/3}
.gico svg{width:24px;height:24px;fill:#fff}

.pg-num{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.filter-toggle{display:none}
@media (max-width:860px){

  .filters,.side{position:static}

g nhân sản xuất làm việc tại các nhà máy, khu công nghiệp ở Quảng Ninh, có cả hình thức chính thức và thời vụ. Không cần CV: bạn chỉ cần để lại họ tên, năm sinh và số điện thoại, bộ phận tuyển dụng sẽ gọi lại tư vấn nhà máy, mức lương và ca làm phù hợp.", "desc": ["Làm việc tại nhà máy, khu công nghiệp ở Quảng Ninh", "Có thể chọn làm chính thức hoặc thời vụ", "Công việc cụ thể, mức lương và ca làm được tư vấn khi gọi lại"], "req": ["Không cần CV", "Chỉ cần để lại họ tên, năm sinh và số điện thoại"], "ben": [], "status": "open"}], "posts": [{"id": "phong-van-5-cau", "section": "blog", "cat": "Phỏng vấn", "tone": "a", "kicker": "5 câu hỏi", "title": "5 câu hỏi phỏng vấn gần như lần nào cũng gặp, và cách trả lời", "excerpt": "Giới thiệu bản thân, điểm yếu, vì sao nghỉ việc cũ… Những câu quen thuộc nhưng dễ trả lời hời hợt nhất. Đây là cách HR thường lắng nghe câu trả lời của bạn.", "date": "2026-11-18", "read": 6, "sample": false, "body": [{"p": "Sau nhiều buổi phỏng vấn, mình nhận ra phần lớn ứng viên không trượt vì thiếu năng lực, mà vì trả lời những câu quen thuộc một cách quá chung chung. Dưới đây là 5 câu gần như buổi nào cũng có, và điều HR thật sự muốn nghe."}, {"h": "1. “Bạn hãy giới thiệu về bản thân”"}, {"p": "Đây không phải lúc kể lại toàn bộ CV. Hãy nói trong khoảng 1–2 phút theo thứ tự: hiện tại bạn đang làm gì, điều bạn làm tốt nhất kèm một ví dụ, và vì sao bạn quan tâm vị trí này."}, {"tip": "Kết thúc phần giới thiệu bằng một câu nối sang vị trí đang ứng tuyển, ví dụ: “Vì vậy khi thấy công ty cần người vận hành kênh YouTube, em nghĩ đây là việc em làm tốt nhất.”"}, {"h": "2. “Điểm yếu của bạn là gì?”"}, {"p": "Đừng trả lời “em cầu toàn quá”. HR muốn biết bạn có tự nhìn nhận được bản thân không. Chọn một điểm yếu có thật, không phải kỹ năng cốt lõi của vị trí, rồi nói bạn đang làm gì để cải thiện."}, {"h": "3. “Vì sao bạn nghỉ công việc cũ?”"}, {"p": "Tránh nói xấu sếp hay công ty cũ. Hãy nói về điều bạn đang tìm kiếm: cơ hội học thêm, môi trường phù hợp hơn, hoặc công việc gần nhà hơn."}, {"h": "4. “Bạn mong muốn mức lương bao nhiêu?”"}, {"p": "Tìm hiểu mức lương thị trường trước buổi phỏng vấn và đưa ra một khoảng, không phải một con số cố định. Nếu chưa chắc, bạn có thể hỏi lại về khung lương của vị trí."}, {"h": "5. “Bạn có câu hỏi gì cho chúng tôi không?”"}, {"p": "Luôn chuẩn bị sẵn 1–2 câu hỏi. Đây là cách đơn giản nhất để cho thấy bạn thật sự quan tâm."}, {"list": ["Một ngày làm việc bình thường ở vị trí này gồm những gì?", "Trong 3 tháng đầu, công ty kỳ vọng điều gì ở người mới?", "Đội nhóm hiện tại có bao nhiêu người?"]}, {"tip": "Ghi chú câu trả lời của bạn ra giấy và tập nói thành tiếng ít nhất một lần. Nói ra khác hẳn với nghĩ trong đầu."}]}, {"id": "ai-sua-cv", "section": "ai", "cat": "Cho ứng viên", "tone": "a", "kicker": "CV + AI", "title": "Dùng AI để sửa CV theo đúng tin tuyển dụng", "excerpt": "Ba bước đơn giản để AI giúp bạn làm nổi bật kinh nghiệm phù hợp với từng vị trí, kèm câu lệnh mẫu sao chép được ngay.", "date": "2026-11-18", "read": 5, "sample": false, "tools": ["ChatGPT", "Gemini", "Claude"], "level": "Cơ bản", "body": [{"p": "Mỗi vị trí cần những điểm mạnh khác nhau, nhưng phần lớn ứng viên dùng một CV cho mọi nơi. AI giúp bạn chỉnh CV cho từng tin tuyển dụng chỉ trong vài phút, miễn là bạn đưa đủ thông tin và tự kiểm tra lại kết quả."}, {"h": "Bạn cần chuẩn bị"}, {"list": ["Nội dung CV hiện tại (sao chép chữ từ file Word hoặc PDF)", "Toàn bộ nội dung tin tuyển dụng (JD) bạn muốn ứng tuyển", "Một công cụ AI: ChatGPT, Gemini hoặc Claude, bản miễn phí là đủ"]}, {"h": "Bước 1: Nhờ AI chỉ ra điểm chưa khớp"}, {"prompt": "Bạn là chuyên viên tuyển dụng có kinh nghiệm. Dưới đây là CV của tôi và tin tuyển dụng tôi muốn ứng tuyển.\n\nHãy liệt kê:\n1. Những yêu cầu trong tin tuyển dụng mà CV của tôi đã đáp ứng tốt\n2. Những yêu cầu CV chưa thể hiện rõ\n3. Từ khóa quan trọng trong tin tuyển dụng mà CV đang thiếu\n\nCV:\n[dán CV]\n\nTin tuyển dụng:\n[dán JD]"}, {"h": "Bước 2: Viết lại phần kinh nghi ated field (practical skills matter more than the degree)", "Ít nhất 1 năm kinh nghiệm quay chụp, dựng video, ưu tiên ngành thời trang hoặc bán lẻ": "At least 1 year of experience in shooting and video editing, ideally in fashion or retail", "Thành thạo ít nhất một phần mềm chỉnh ảnh (Lightroom, Photoshop) và một phần mềm dựng video (Premiere, CapCut, Final Cut)": "Proficient in at least one photo editor (Lightroom, Photoshop) and one video editor (Premiere, CapCut, Final Cut)", "Biết dùng máy ảnh, đèn, gimbal; quay dựng tốt video dọc trên điện thoại": "Comfortable with cameras, lights and gimbals; skilled at shooting and editing vertical video on a phone", "Có portfolio ảnh/video gửi kèm hồ sơ": "Photo/video portfolio to send with your application", "Ưu tiên: hiểu TikTok, Reels, Shopee Video và xu hướng nội dung mới": "Preferred: understanding of TikTok, Reels, Shopee Video and new content trends", "Ưu tiên: có gu thời trang nữ, hiểu tâm lý mẹ bầu và phụ nữ sau sinh; biết Canva, Photoshop, từng hỗ trợ livestream": "Preferred: an eye for women's fashion, understanding of expectant and new mothers; Canva and Photoshop skills; livestream experience", "Sáng tạo, chủ động, chịu được nhịp làm việc nhanh; cẩn thận, đúng hạn, phối hợp tốt với Kinh doanh, Thiết kế, Sản xuất": "Creative, proactive and comfortable with a fast pace; careful, on time and works well with Sales, Design and Production", "Lương cứng + thưởng theo KPI nội dung và doanh số, tổng thu nhập up to 20++ triệu/tháng": "Base salary + bonus based on content KPIs and sales, total income up to 20+ million VND/month", "Thưởng lễ, Tết, sinh nhật; xét tăng lương định kỳ theo năng lực": "Holiday, Lunar New Year and birthday bonuses; regular salary reviews based on performance", "Được trang bị thiết bị quay chụp và phòng chụp tại công ty": "Filming equipment and an in-house photo studio provided", "Môi trường trẻ, thân thiện, tự do sáng tạo và thử nghiệm ý tưởng": "Young, friendly environment with freedom to create a; English club, yoga, football…", "Business Development Manager": "Business Development Manager", "Quản lý": "Manager", "Khách hàng là một công ty công nghệ hàng đầu Việt Nam, xây dựng sản phẩm phục vụ hàng triệu người dùng. Vị trí thuộc bộ phận Sales, yêu cầu ứng viên đã có kinh nghiệm. Quy trình: Phone Screening → Phỏng vấn chuyên môn → Phỏng vấn văn hóa → Offer.": "Our client is one of Vietnam's leading technology companies, building products used by millions of people. The role sits in the Sales team and requires prior experience. Process: Phone screening → Technical interview → Culture interview → Offer.", "Xây dựng và duy trì quan hệ bền vững, lâu dài với khách hàng": "Build and maintain strong, long-term client relationships", "Nghiên cứu và mở rộng tệp khách hàng": "Research and expand the client base", "Lập kế hoạch chi tiết để tiếp cận và làm việc với từng khách hàng": "Plan in detail how to approach and work with each client", "Phối hợp với quản lý dự án đặc biệt và chuyên viên hoạch định chiến lược để đưa ra ý tưởng, chiến lược truyền tải thông điệp quảng cáo tới khách hàng": "Work with the special projects manager and strategy planners to develop ideas and strategies for delivering advertising messages to clients", "Chủ động tìm cơ hội kinh doanh mới, đề xuất giải pháp kịp thời để đạt mục tiêu": "Actively seek new business opportunities and propose timely solutions to reach targets", "Tổ chức và tham gia workshop, sự kiện để phát triển hình ảnh thương hiệu": "Organise and take part in workshops and events to build the brand", "Các công việc khác theo phân công của quản lý trực tiếp": "Other tasks assigned by your direct manager", "Tốt nghiệp Đại học hoặc tương đương, ít nhất 3 năm kinh nghiệm B2B Sales / Business Development hoặc vị trí tương tự": "University degree or equivalent, with at least 3 years of experience in B2B Sales / Business Development or a similar role", "Hiểu về quảng cáo trực tuyến hoặc digital marketing là lợi thế lớn": "Understanding of online advertising or digital marketing is a big plus", "Làm việc tốt trong môi trường năng động, thay đổi nhanh": "Thrives in a dynamic, fast-changing environment", "Giao tiếp tốt cả tiếng Anh và tiếng Việt": "Strong communication in both English and Vietnamese", "Kỹ năng viết, nói, thuyết trình tốt; thuyết phục được cả đối tượng kinh doanh và kỹ thuật": "Strong writing, speaking and presentation skills; able to persuade both business and technical audiences", "Ra quyết định, tư duy phân tích và quản trị rủi ro tốt": "Good decision-making, analytical thinking and risk management", "Kỹ năng lập kế hoạch, tổ chức, dự báo; hiểu vận hành doanh nghiệp đa mảng": "Planning, organising and forecasting skills; understands how a multi-business company operates", "Đánh giá hiệu suất 2 lần/năm, cơ hội thăng tiến hoặc luân chuyển nội bộ": "Performance review twice a year, with promotion or internal transfer opportunities", "Nghỉ phép tối thiểu 19 ngày/năm, thêm 1 ngày nghỉ sinh nhật": "At least 19 days of annual leave, plus 1 day off on your birthday", "Chính sách làm việc tại nhà hằng năm": "Annual work-from-home policy", "Bảo hiểm sức khỏe cao cấp 24/7 cho toàn bộ nhân viên": "24/7 premium health insurance for all employees", "Đào tạo, coaching, chia sẻ kiến thức nội bộ thường xuyên; làm việc cùng đồng nghiệp và đối tác trong và ngoài nước": "Regular training, coaching and internal knowledge sharing; work with colleagues and partners in Vietnam and abroad", "Pantry nhiều đồ ăn nhẹ, nước, cà phê, trà; CLB tiếng Anh, yoga, bi-a, bóng đá": "Pantry with snacks, drinks, coffee and tea; English club, yoga, billiards, football", "Công nhân sản xuất (Chính thức / Thời vụ)": "Production Worker (Permanent / Seasonal)", "Nhiều nhà máy, khu công nghiệp tại Hà Nội": "Many factories and industrial parks in Hanoi", "Sản xuất / Công nhân": "Manufacturing / Production", "Chính thức / Thời vụ": "Permanent / Seasonal", "Thỏa thuận": "Negotiable", "Tuyển công nhân sản xuất làm việc tại các nhà máy, khu công nghiệp ở Hà Nội, có cả hình thức chính thức và thời vụ. Không cần CV: bạn chỉ cần để lại họ tên, năm sinh và số điện thoại, bộ phận tuyển dụng sẽ gọi lại tư vấn nhà máy, mức lương và ca làm phù hợp.": "Hiring production workers for factories and industrial parks in Hanoi, with both permanent and seasonal positions. No CV needed: just leave your full name, year of birth and phone number, and our recruitment team will call you to recommend a suitable factory, salary and shift.", "Làm việc tại nhà máy, khu công nghiệp ở Hà Nội": "Work at factories and industrial parks in Hanoi", "Có thể chọn làm chính thức hoặc thời vụ": "Choose permanent or seasonal work", "Công việc cụ thể, mức lương và ca làm được tư vấn khi gọi lại": "Specific duties, salary and shifts are explained when we call you back", "Không cần CV": "No CV needed", "Chỉ cần để lại họ tên, năm sinh và số điện thoại": "Just leave your full name, year of birth and phone number", "Nhiều nhà máy, khu công nghiệp tại Hải Phòng": "Many factories and industrial parks in Hai Phong", "Hải Phòng": "Hai Phong", "Tuyển công nhân sản xuất làm việc tại các nhà máy, khu công nghiệp ở Hải Phòng, có cả hình thức chính thức và thời vụ. Không cần CV: bạn chỉ cần để lại họ tên, năm sinh và số điện thoại, bộ phận tuyển dụng sẽ gọi lại tư vấn nhà máy, mức lương và ca làm phù hợp.": "Hiring production workers for factories and industrial parks in Hai Phong, with both permanent and seasonal positions. No CV needed: just leave your full name, year of birth and phone number, and our recruitment team will call you to recommend a suitable factory, salary and shift.", "Làm việc tại nhà máy, khu công nghiệp ở Hải Phòng": "Work at factories and industrial parks in Hai Phong", "Nhiều nhà máy, khu công nghiệp tại Quảng Ninh": "Many factories and industrial parks in Quang Ninh", "Quảng Ninh": "Quang Ninh", "Tuyển công nhân sản xuất làm việc tại các nhà máy, khu công nghiệp ở Quảng Ninh, có cả hình thức chính thức và thời vụ. Không cần CV: bạn chỉ cần để lại họ tên, năm sinh và số điện thoại, bộ phận tuyển dụng sẽ gọi lại tư vấn nhà máy, mức lương và ca làm phù hợp.": "Hiring production workers for factories and industrial parks in Quang Ninh, with both permanent and seasonal positions. No CV needed: just leave your full name, year of birth and phone number, and our recruitment team will call you to recommend a suitable factory, salary and shift.", "Làm việc tại nhà máy, khu công nghiệp ở Quảng Ninh": "Work at factories and industrial parks in Quang Ninh", "Phỏng vấn": "Interviews", "5 câu hỏi": "5 questions", "5 câu hỏi phỏng vấn gần như lần nào cũng gặp, và cách trả lời": "5 interview questions you'll almost always get, and how to answer them", "Giới thiệu bản thân, điểm yếu, vì sao nghỉ việc cũ… Những câu quen thuộc nhưng dễ trả lời hời hợt nhất. Đây là cách HR thường lắng nghe câu trả lời của bạn.": "Introduce yourself, your weaknesses, why you left your last job… Familiar questions that are easiest to answer too vaguely. Here is how HR usually listens to your answers.", "Sau nhiều buổi phỏng vấn, mình nhận ra phần lớn ứng viên không trượt vì thiếu năng lực, mà vì trả lời những câu quen thuộc một cách quá chung chung. Dưới đây là 5 câu gần như buổi nào cũng có, và điều HR thật sự muốn nghe.": "After many interviews, I've noticed that most candidates don't fail for lack of skill, but because they answer familiar questions too generically. Here are 5 questions that come up in almost every interview, and what HR really wants to hear.", "1. “Bạn hãy giới thiệu về bản thân”": "1. “Tell me about yourself”", "Đây không phải lúc kể lại toàn bộ CV. Hãy nói trong khoảng 1–2 phút theo thứ tự: hiện tại bạn đang làm gì, điều bạn làm tốt nhất kèm một ví dụ, và vì sao bạn quan tâm vị trí này.": "This isn't the time to recite your whole CV. Speak for about 1–2 minutes in this order: what you do now, what you do best with one example, and why you're interested in this role.", "Kết thúc phần giới thiệu bằng một câu nối sang vị trí đang ứng tuyển, ví dụ: “Vì vậy khi thấy công ty cần người vận hành kênh YouTube, em nghĩ đây là việc em làm tốt nhất.”": "End your introduction with a sentence that links to the role, for example: “So when I saw you needed someone to run a YouTube channel, I knew it was exactly what I do best.”", "2. “Điểm yếu của bạn là gì?”": "2. “What is your weakness?”", "Đừng trả lời “em cầu toàn quá”. HR muốn biết bạn có tự nhìn nhận được bản thân không. Chọn một điểm yếu có thật, không phải kỹ năng cốt lõi của vị trí, rồi nói bạn đang làm gì để cải thiện.": "Don't say “I'm a perfectionist”. HR wants to know whether you can assess yourself honestly. Pick a real weakness that isn't a core skill for the role, then explain what you're doing to improve it.", "3. “Vì sao bạn nghỉ công việc cũ?”": "3. “Why did you leave your last job?”", "Tránh nói xấu sếp hay công ty cũ. Hãy nói về điều bạn đang tìm kiếm: cơ hội học thêm, môi trường phù hợp hơn, hoặc công việc gần nhà hơn.": "Don't criticise your former boss or company. Talk about what you're looking for: more chances to learn, a better-fitting environment, or a job closer to home.", "4. “Bạn mong muốn mức lương bao nhiêu?”": "4. “What salary are you expecting?”", "Tìm hiểu mức lương thị trường trước buổi phỏng vấn và đưa ra một khoảng, không phải một con số cố định. Nếu chưa chắc, bạn có thể hỏi lại về khung lương của vị trí.": "Research the market rate before the interview and give a range rather than a fixed number. If you're not sure, you can ask about the salary band for the role.", "5. “Bạn có câu hỏi gì cho chúng tôi không?”": "5. “Do you have any questions for us?”", "Luôn chuẩn bị sẵn 1–2 câu hỏi. Đây là cách đơn giản nhất để cho thấy bạn thật sự quan tâm.": "Always prepare 1–2 questions. It's the simplest way to show you're genuinely interested.", "Một ngày làm việc bình thường ở vị trí này gồm những gì?": "What does a typical day in this role look like?", "Trong 3 tháng đầu, công ty kỳ vọng điều gì ở người mới?": "What does the company expect from a new hire in the first 3 months?", "Đội nhóm hiện tại có bao nhiêu người?": "How many people are on the team now?", "Ghi chú câu trả lời của bạn ra giấy và tập nói thành tiếng ít nhất một lần. Nói ra khác hẳn với nghĩ trong đầu.": "Write your answers down and practise saying them out loud at least once. Saying it is very different from thinking it.", "Cho ứng viên": "For candidates", "CV + AI": "CV + AI", "Dùng AI để sửa CV theo đúng tin tuyển dụng": "Use AI to tailor your CV to a job posting", "Ba bước đơn giản để AI giúp bạn làm nổi bật kinh nghiệm phù hợp với từng vị trí, kèm câu lệnh mẫu sao chép được ngay.": "Three simple steps to let AI highlight the experience that fits each role, with sample prompts you can copy right away.", "ChatGPT": "ChatGPT", "Gemini": "Gemini", "Claude": "Claude", "Cơ bản": "Beginner", "Mỗi vị trí cần những điểm mạnh khác nhau, nhưng phần lớn ứng viên dùng một CV cho mọi nơi. AI giúp bạn chỉnh CV cho từng tin tuyển dụng chỉ trong vài phút, miễn là bạn đưa đủ thông tin và tự kiểm tra lại kết quả.": "Every role needs different strengths, yet most candidates send the same CV everywhere. AI can help you tailor your CV to each job posting in a few minutes, as long as you give it enough information and check the result yourself.", "Bạn cần chuẩn bị": "What you need", "Nội dung CV hiện tại (sao chép chữ từ file Word hoặc PDF)": "Your current CV text (copy the text from your Word or PDF file)", "Toàn bộ nội dung tin tuyển dụng (JD) bạn muốn ứng tuyển": "The full job posting (JD) you want to apply for", "Một công cụ AI: ChatGPT, Gemini hoặc Claude, bản miễn phí là đủ": "An AI tool: ChatGPT, Gemini or Claude; the free version is enough", "Bước 1: Nhờ AI chỉ ra điểm chưa khớp": "Step 1: Ask AI to find the gaps", "Bạn là chuyên viên tuyển dụng có kinh nghiệm. Dưới đây là CV của tôi và tin tuyển dụng tôi muốn ứng tuyển.\n\nHãy liệt kê:\n1. Những yêu cầu trong tin tuyển dụng mà CV của tôi đã đáp ứng tốt\n2. Những yêu cầu CV chưa thể hiện rõ\n3. Từ khóa quan trọng trong tin tuyển dụng mà CV đang thiếu\n\nCV:\n[dán CV]\n\nTin tuyển dụng:\n[dán JD]": "You are an experienced recruiter. Below are my CV and the job posting I want to apply for.\n\nPlease list:\n1. The requirements in the job posting that my CV already meets well\n2. The requirements my CV doesn't show clearly\n3. Important keywords from the job posting that my CV is missing\n\nCV:\n[paste CV]\n\nJob posting:\n[paste JD]", "Bước 2: Viết lại phần kinh nghiệm": "Step 2: Rewrite your experience", "Dựa trên phân tích ở trên, hãy viết lại phần Kinh nghiệm làm việc trong CV của tôi để làm nổi bật những điểm phù hợp với tin tuyển dụng. Giữ đúng sự thật, không thêm kinh nghiệm tôi không có. Mỗi ý bắt đầu bằng một động từ và có kết quả cụ thể nếu có.": "Based on the analysis above, rewrite the Work Experience section of my CV to highlight what matches the job posting. Stay truthful and don't add experience I don't have. Start each point with a verb and include concrete results where possible.", "Bước 3: Tự kiểm tra lại": "Step 3: Check it yourself", "Đọc lại từng dòng AI viết. Xóa bất kỳ điều gì không đúng với bạn, vì HR sẽ hỏi lại chi tiết trong buổi phỏng vấn.": "Read every line the AI wrote. Delete anything that isn't true for you, because HR will ask about the details in the interview.", "Không dán số căn cước, địa chỉ nhà hay thông tin nhạy cảm vào công cụ AI. Chỉ cần nội dung kinh nghiệm và kỹ năng là đủ.": "Don't paste your ID number, home address or other sensitive information into an AI tool. Your experience and skills are all it needs.", "Trang chủ": "Home", "Tìm việc": "Find jobs", "Liên hệ đăng tin": "For employers", "Blog": "Blog", "Ứng dụng AI": "AI at work", "Đăng tin tuyển dụng": "Post a job", "Chính": "Main", "Khám phá việc làm, mở ra cơ hội mới tại đây": "Discover jobs and open up new opportunities here", "Việc làm được cập nhật thường xuyên ở Hà Nội, Quảng Ninh và Hải Phòng.": "Jobs updated regularly in Hanoi, Quang Ninh and Hai Phong.", "Tất cả địa điểm": "All locations", "việc đang tuyển": "open jobs", "tỉnh / thành": "provinces / cities", "vị trí cần người": "positions to fill", "Ngành nghề": "Industry", "Vị trí đang tuyển": "Open positions", "Lọc theo ngành, lương": "Filter by industry, salary", "Đang tuyển": "Hiring", "Tuyển gấp": "Urgent", "Đã tuyển xong": "Filled", "Tin mẫu": "Sample", "Hết hạn hôm nay": "Closes today", "Chia sẻ mới": "Latest articles", "Ứng tuyển nhanh": "Quick apply", "Chưa tìm thấy vị trí phù hợp, hoặc chưa có CV? Để lại họ tên, năm sinh và số điện thoại, bộ phận tuyển dụng sẽ liên hệ tư vấn vị trí phù hợp với bạn.": "Haven't found the right role, or don't have a CV yet? Leave your full name, year of birth and phone number, and our recruitment team will contact you to suggest a suitable position.", "Họ và tên": "Full name", "Năm sinh": "Year of birth", "Số điện thoại (Zalo)": "Phone number (Zalo)", "Vị trí quan tâm": "Position of interest", "Chưa chọn, nhờ tư vấn giúp": "Not sure yet, please advise me", "Khu vực muốn làm": "Preferred work area", "Gửi thông tin": "Send my details", "Thông báo về xử lý dữ liệu cá nhân:": "Personal data notice:", "Bằng việc gửi thông tin ứng tuyển, bạn xác nhận đồng ý để JOB LISTING thu thập và xử lý dữ liệu cá nhân bạn cung cấp nhằm phục vụ quy trình tuyển dụng. Chúng tôi cam kết không chia sẻ dữ liệu này cho bên thứ ba khi chưa có sự đồng ý của bạn, trừ trường hợp pháp luật yêu cầu.": "By submitting your application details, you agree that JOB LISTING may collect and process the personal data you provide for the purpose of recruitment. We will not share this data with any third party without your consent, except where required by law.", "Bằng việc gửi thông tin ứng tuyển, bạn xác nhận đồng ý để JOB LISTING thu thập và xử lý dữ liệu cá nhân bạn cung cấp nhằm phục vụ quy trình tuyển dụng cho vị trí này. Chúng tôi cam kết không chia sẻ dữ liệu này cho bên thứ ba khi chưa có sự đồng ý của bạn, trừ trường hợp pháp luật yêu cầu.": "By submitting your application details, you agree that JOB LISTING may collect and process the personal data you provide for the purpose of recruiting for this position. We will not share this data with any third party without your consent, except where required by law.", "Bằng việc gửi hồ sơ ứng tuyển, bạn xác nhận đồng ý để JOB LISTING thu thập và xử lý dữ liệu cá nhân bạn cung cấp trong hồ sơ (CV) nhằm phục vụ quy trình tuyển dụng cho vị trí này. Chúng tôi cam kết không chia sẻ dữ liệu này cho bên thứ ba khi chưa có sự đồng ý của bạn, trừ trường hợp pháp luật yêu cầu.": "By submitting your application, you agree that JOB LISTING may collect and process the personal data in your application (CV) for the purpose of recruiting for this position. We will not share this data with any third party without your consent, except where required by law.", "Các job mới được cập nhật vào mỗi thứ Hai đầu tuần.": "New jobs are posted every Monday.", "Đăng tin tuyển dụng & hỗ trợ ứng tuyển:": "Job postings & application support:", "Liên hệ trực tiếp chuyên viên tuyển dụng:": "Contact our recruiter directly:", "Chức danh, công ty, ngành nghề…": "Job title, company, industry…", "Từ khóa": "Keyword", "Địa điểm": "Location", "VD: Nguyễn Văn An": "e.g. Nguyen Van An", "VD: 1998": "e.g. 1998", "VD: 0912 345 678": "e.g. 0912 345 678", "Kho vận / Logistics": "Warehouse / Logistics", "Dịch vụ / Nhà hàng": "Hospitality / Restaurants", "Hành chính / Nhân sự": "Admin / HR", "Mức lương": "Salary", "Tất cả": "All", "Dưới 10 triệu": "Under 10 million VND", "10–20 triệu": "10–20 million VND", "Trên 20 triệu": "Over 20 million VND", "Cấp bậc": "Level", "Trưởng nhóm": "Team Lead", "Hình thức": "Job type", "Bán thời gian": "Part-time", "Thời vụ": "Seasonal", "Xóa bộ lọc": "Clear filters", "Bộ lọc": "Filters", "Mới nhất": "Newest", "Lương cao nhất": "Highest salary", "Sắp hết hạn": "Closing soon", "Sắp xếp": "Sort", "Không có việc phù hợp. Thử bỏ bớt bộ lọ   else if(!/^(\+?84|0)\d{9,10}$/.test(phone))msg="Số điện thoại chưa đúng, ví dụ: 0912345678.";
  if(msg){err.textContent=msg;err.hidden=false;return}
  err.hidden=true;btn.disabled=true;btn.textContent="Đang gửi…";
  const body=new URLSearchParams();body.append(QF.area,area);body.append(QF.name,name);body.append(QF.year,year);body.append(QF.phone,phone);if(QF.pos){const jj=DATA.jobs.find(x=>x.id===f.dataset.id);body.append(QF.pos,f.pos?f.pos.value:(jj?jj.title+" – "+jj.location:""));}

  catch(e){btn.disabled=false;btn.textContent="Gửi thông tin";
    err.innerHTML=`Không gửi được từ trang này. <a href="${esc(QF.view)}" target="_blank" rel="noopener">Bấm vào đây để mở form ứng tuyển</a>.`;err.hidden=false;}}

  <label class="fld">Lương từ (triệu)<input id="j-smin" name="salaryMin" type="number" min="0" step="0.5" value="${esc(j.salaryMin)}" placeholder="Bỏ trống = thỏa thuận"></label>
  <label class="fld">Lương đến (triệu)<input id="j-smax" name="salaryMax" type="number" min="0" step="0.5" value="${esc(j.salaryMax)}"></label>
  <label class="fld">Hạn nộp hồ sơ<input id="j-deadline" name="deadline" type="date" required value="${esc(dl)}"></label>
  <label class="fld">Trạng thái<select id="j-status" name="status">${[["open","Đang tuyển"],["urgent","Tuyển gấp"],["closed","Đã tuyển xong"]].map(([v,t])=>`<option value="${v}" ${stat(j)===v?"selected":""}>${t}</option>`).join("")}</select></label>
  <label class="fld full">Mô tả công việc (mỗi dòng một ý)<textarea id="j-desc" name="desc" rows="3">${lines(j.desc)}</textarea></label>
  <label class="fld full">Yêu cầu (mỗi dòng một ý)<textarea id="j-req" name="req" rows="3">${lines(j.req)}</textarea></label>
  <label class="fld full">Quyền lợi (mỗi dòng một ý)<textarea id="j-ben" name="ben" rows="3">${lines(j.ben)}</textarea></label>
  <div class="full" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" ${ui.saving?"disabled":""}>${ui.editId?"Lưu thay đổi":"Đăng tin"}</button>${ui.editId?'<button class="btn ghost" type="button" id="cancelEdit">Hủy sửa</button>':""}</div>
  </form>`}

const NET={linkedin:{n:"LinkedIn",c:"#0A66C2",i:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="3.4" height="11" rx=".6"/><circle cx="5.7" cy="5.6" r="2"/><path d="M10 9h3.2v1.6c.6-1 1.8-1.9 3.6-1.9 3 0 3.6 2 3.6 4.6V20H17v-5.8c0-1.4-.1-2.8-1.8-2.8s-2 1.3-2 2.7V20H10z"/></svg>'},
 facebook:{n:"Facebook",c:"#1877F2",i:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.6-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.9v3h2.6V21z"/></svg>'},
 discord:{n:"Discord",c:"#5865F2",i:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.6 6.2A15 15 0 0 0 15 5l-.4.9a13.6 13.6 0 0 0-5.2 0L9 5a15 15 0 0 0-3.6 1.2C3.1 9.6 2.5 13 2.8 16.3A15 15 0 0 0 7.2 18.5l.9-1.5c-.5-.2-1-.4-1.5-.7l.4-.3a10.6 10.6 0 0 0 10 0l.4.3c-.5.3-1 .5-1.5.7l.9 1.5a15 15 0 0 0 4.4-2.2c.4-3.8-.6-7.1-2.6-10.1zM9.1 14.3c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8zm5.8 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8z"/></svg>'}};
function groupsBlock(){const G=S.groups||[];if(!G.length)return "";
  return `<section class="groups" aria-labelledby="gh"><div><h2 id="gh">Tham gia cộng đồng JOB LISTING</h2><div class="gintro"><p>Tham gia cộng đồng để không bỏ lỡ những cơ hội việc làm mới nhất, cập nhật thông tin tuyển dụng sớm, chia sẻ kinh nghiệm và kết nối trực tiếp với nhà tuyển dụng.</p><p class="gfree">✨ Hoàn toàn miễn phí – chỉ cần nhấn Tham gia là bạn đã trở thành một phần của cộng đồng!</p><p>Có bất kỳ thắc mắc nào về công việc, tuyển dụng hay định hướng nghề nghiệp? Đừng ngần ngại đặt câu hỏi trên Discord nhé. Mình luôn sẵn sàng hỗ trợ và sẽ phản hồi bạn trong thời gian sớm nhất!</p></div></div>
  <div class="gcards">${G.map(g=>{const n=NET[g.net]||{n:g.net,c:"var(--accent)",i:""};return `<a class="gcard" href="${esc(g.url)}" target="_blank" rel="noopener" style="--net:${n.c}"><span class="gico">${n.i}</span><span class="gtext"><small>${esc(n.n)}</small><b>${esc(g.name)}</b><span>${esc(g.desc)}</span></span><span class="gjoin">Tham gia</span></a>`}).join("")}</div></section>`}
function employer(){
  const msg=ui.msg?`<div class="alert ${ui.msg.err?"err":""}">${esc(ui.msg.text)}</div>`:"";
  if(ui.canEdit===null)return `<div class="wrap section"><h2>Nhà tuyển dụng</h2><p class="note">Đang kiểm tra quyền quản lý trang…</p></div>`;
  if(!ui.canEdit)return `<div class="wrap section" style="max-width:900px"><h2>Đăng tin tuyển dụng</h2>${msg}
   <div class="panel"><p style="margin:0">Bạn muốn đăng tin trên JOB LISTING? Gửi thông tin vị trí cần tuyển cho chúng tôi, tin sẽ lên trang trong ngày.</p>
   <p style="margin:0">Đăng tin tuyển dụng &amp; hỗ trợ ứng tuyển: <b>${esc(S.siteEmail||S.email)}</b><br>Liên hệ trực tiếp chuyên viên tuyển dụng: <b>${esc(S.email)}</b></p>
   <div><button class="btn primary" type="button" data-copy="${esc(S.siteEmail||S.email)}">Sao chép email đăng tin</button></div></div>${groupsBlock()}</div>`;
  const editing=ui.editId?DATA.jobs.find(j=>j.id===ui.editId):null;
  const sorted=DATA.jobs.slice().sort((a,b)=>b.posted.localeCompare(a.posted));
  return `<div class="wrap section"><div class="section-head"><h2>Quản lý tin tuyển dụng</h2><span class="note">Chỉ chủ trang thấy mục này. Mỗi lần lưu, trang cập nhật cho mọi người xem.</span></div>${msg}
  <div class="detail" style="padding-top:0">
   <div class="panel"><h3>${editing?"Sửa tin: "+esc(editing.title):"Đăng tin mới"}</h3>${jobForm(editing)}</div>
   <aside class="side">
    <div class="panel"><h3>Tin đã đăng (${DATA.jobs.length})</h3><div class="mini-list">
     ${sorted.map(j=>{const d=daysLeft(j.deadline);return `<div class="mini"><div><b>${esc(j.title)}</b><span>${ST[stat(j)][0]} · ${esc(j.company||j.location)} · ${d>=0?"còn "+d+" ngày":"hết hạn"}</span></div><div class="acts">
      ${ui.confirmDel===j.id?`<button class="btn danger" data-del-yes="${esc(j.id)}" ${ui.saving?"disabled":""}>Xóa thật</button><button class="btn ghost" data-del-no>Không</button>`:`<button class="btn ghost" data-edit="${esc(j.id)}">Sửa</button><button class="btn danger" data-del="${esc(j.id)}">Xóa</button>`}</div></div>`}).join("")||'<p class="note">Chưa có tin nào.</p>'}
    </div></div>
    <div class="panel"><h3>Thông tin liên hệ</h3><form class="grid" id="setForm">
     <label class="fld full">Người liên hệ<input id="s-name" name="contactName" value="${esc(S.contactName)}"></label>
     <label class="fld full">Email<input id="s-email" name="email" type="email" required value="${esc(S.email)}"></label>
     <label class="fld full">Link form nộp CV (Google Form, không bắt buộc)<input id="s-form" name="formUrl" type="url" placeholder="https://forms.gle/…" value="${esc(S.formUrl)}"></label>
     <label class="fld check full"><input id="s-sample" name="sample" type="checkbox" ${S.sample?"checked":""}> Hiện dòng báo “dữ liệu mẫu”</label>
     <button class="btn primary full" type="submit" ${ui.saving?"disabled":""}>Lưu liên hệ</button></form></div>
   </aside></div></div>`}
function footer(){return `<footer><div class="wrap"><div class="f-brand"><b>JOB LISTING</b><span>Các job mới được cập nhật vào mỗi thứ Hai đầu tuần.</span></div><div class="f-contact"><span>Đăng tin tuyển dụng &amp; hỗ trợ ứng tuyển: <b>${esc(S.siteEmail||S.email)}</b></span><span>Liên hệ trực tiếp chuyên viên tuyển dụng: <b>${esc(S.email)}</b></span></div></div></footer>`}
function route(){const h=location.hash.slice(1);if(h.startsWith("job-"))return["job",h.slice(4)];if(h.startsWith("post-"))return["post",h.slice(5)];if(h==="jobs"||h==="employer"||h==="blog"||h==="ai")return[h];return["home"]}
function render(){const [r,id]=route();const body=r==="jobs"?jobs():r==="job"?detail(id):r==="employer"?employer():r==="blog"||r==="ai"?postsPage(r):r==="post"?postView(id):home();
  app.innerHTML=nav(r==="job"?"jobs":r==="post"?((DATA.posts||[]).find(x=>x.id===id)||{}).section:r)+`<main class="view">${body}</main>`+footer();
  if(ui.applyOut&&r==="job"&&ui.applyOut.id===id)showApply(ui.applyOut.o);}
function go(h){if(location.hash==="#"+h){render();scrollTo(0,0)}else location.hash=h}
window.addEventListener("hashchange",()=>{ui.applyOut=null;ui.confirmDel=null;render();scrollTo(0,0)});
function copy(text,btn){const done=t=>{btn.textContent=t};navigator.clipboard.writeText(text).then(()=>done("Đã sao chép")).catch(()=>done("Hãy bôi đen và sao chép thủ công"))}
function showApply(o){const out=document.getElementById("applyOut");if(!out)return;
  out.innerHTML=`<div style="display:grid;gap:10px;margin-top:6px">
   <div class="copy-row"><span class="note">Gửi tới</span><b>${esc(S.email)}</b><button class="btn ghost" type="button" data-copy="${esc(S.email)}">Sao chép</button></div>
   <div class="copy-row"><span class="note">Tiêu đề</span><b>${esc(o.subj)}</b><button class="btn ghost" type="button" data-copy="${esc(o.subj)}">Sao chép</button></div>
   <pre class="msg" id="applyMsg">${esc(o.body)}</pre>
   <button class="btn primary" type="button" data-copy="${esc(o.body)}">Sao chép nội dung email</button>
   <p class="alert">Nhớ <b>đính kèm CV (PDF, DOC hoặc DOCX)</b> trước khi gửi. Bộ phận tuyển dụng sẽ liên hệ lại với ứng viên phù hợp.</p></div>`;}
const vals=(f,n)=>[...f.querySelectorAll(`input[name="${n}"]:checked`)].map(i=>i.value);
app.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.id==="searchForm"){ui.q=f.querySelector("#sq").value;ui.loc=f.querySelector("#sl").value;go("jobs");}
  else if(f.id==="applyForm"){const j=DATA.jobs.find(x=>x.id===f.dataset.id),d=Object.fromEntries(new FormData(f));
    const subj=`Ứng tuyển ${j.title} – ${d.name.trim()}`;
    const body=`Kính gửi Anh/Chị phụ trách tuyển dụng,\n\nEm xin ứng tuyển vị trí: ${j.title} (${j.address||j.location}).\n\nHọ tên: ${d.name}\nSố điện thoại: ${d.phone}\nEmail: ${d.mail||"-"}\nNăm sinh: ${d.year||"-"}\nNơi ở: ${d.addr||"-"}\nKinh nghiệm / lời nhắn: ${d.note||"-"}\n\nEm gửi kèm CV trong email này. Mong sớm nhận được phản hồi từ Anh/Chị.\nTrân trọng.`;
    ui.applyOut={id:j.id,o:{subj,body}};showApply(ui.applyOut.o);}
  else if(f.id==="quickForm")sendQuick(f);
  else if(f.id==="jobForm")saveJob(f);
  else if(f.id==="setForm"){const d=new FormData(f);save(()=>{Object.assign(S,{contactName:d.get("contactName").trim(),email:d.get("email").trim(),formUrl:String(d.get("formUrl")||"").trim(),sample:d.get("sample")==="on"})},"Đã lưu thông tin liên hệ.");}
});
app.addEventListener("change",e=>{const t=e.target,f=document.getElementById("filters");
  if(f&&f.contains(t)){ui.cats=vals(f,"cat");ui.levels=vals(f,"level");ui.types=vals(f,"type");ui.sal=(f.querySelector('input[name="sal"]:checked')||{}).value||"all";render();}
  else if(t.id==="sort"){ui.sort=t.value;render();}});
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){I18N.set(b.dataset.lang);render()}
  else if(b.dataset.pg){const k=b.dataset.pg,d=+b.dataset.dir;ui[k]=(ui[k]||0)+d;render();
    const s=document.getElementById(k==="hpage"?"hjobs":"hposts");if(s&&s.getBoundingClientRect().top<0)s.scrollIntoView({block:"start"});
    const nb=document.querySelector(`[data-pg="${k}"][data-dir="${d}"]`);const fb=nb&&!nb.disabled?nb:document.querySelector(`[data-pg="${k}"]:not([disabled])`);if(fb)fb.focus({preventScroll:true})}
  else if(b.dataset.pcat!==undefined){ui.pcat=b.dataset.pcat;render()}
  else if(b.dataset.cat){ui.cats=[b.dataset.cat];ui.q="";go("jobs")}
  else if(b.dataset.comp){ui.q=b.dataset.comp;ui.cats=[];go("jobs")}
  else if(b.id==="clearF"){Object.assign(ui,{cats:[],levels:[],types:[],sal:"all"});render()}
  else if(b.id==="ftog"){ui.filtersOpen=!ui.filtersOpen;render()}
  else if(b.dataset.copy!==undefined)copy(b.dataset.copy,b);
  else if(b.dataset.scroll){const t=document.getElementById(b.dataset.scroll);if(t){t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});const f=t.querySelector("input,a.btn");if(f)setTimeout(()=>f.focus({preventScroll:true}),400)}}
  else if(b.dataset.edit){ui.editId=b.dataset.edit;ui.msg=null;render();scrollTo(0,0)}
  else if(b.id==="cancelEdit"){ui.editId=null;render()}
  else if(b.dataset.del){ui.confirmDel=b.dataset.del;render()}
  else if(b.dataset.delNo!==undefined){ui.confirmDel=null;render()}
  else if(b.dataset.delYes){const id=b.dataset.delYes;save(()=>{DATA.jobs=DATA.jobs.filter(j=>j.id!==id)},"Đã xóa tin.")}
});
function saveJob(f){const d=new FormData(f),num=k=>{const v=String(d.get(k)||"").trim();return v===""?null:+v},arr=k=>String(d.get(k)||"").split("\n").map(s=>s.trim()).filter(Boolean);
  let mn=num("salaryMin"),mx=num("salaryMax");if(mn!=null&&mx!=null&&mn>mx)[mn,mx]=[mx,mn];
  const job={title:d.get("title").trim(),company:d.get("company").trim(),location:d.get("location"),address:d.get("address").trim(),category:d.get("category"),level:d.get("level"),type:d.get("type"),qty:num("qty")||1,salaryMin:mn,salaryMax:mx,deadline:d.get("deadline"),status:d.get("status"),hot:false,desc:arr("desc"),req:arr("req"),ben:arr("ben")};
  const id=ui.editId;
  save(()=>{if(id){const o=DATA.jobs.find(j=>j.id===id);Object.assign(o,job)}else DATA.jobs.push(Object.assign({id:"j"+Date.now().toString(36),posted:new Date().toISOString().slice(0,10)},job))},id?"Đã lưu thay đổi.":"Đã đăng tin.");}
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
function buildHtml(){const json=JSON.stringify(DATA).replace(/</g,"\\u003c");
  return SKEL+'\n<title>JOB LISTING</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">\n<style id="css">'+document.getElementById("css").textContent+'</style>\n\n<div id="app"></div>\n\n<script type="application/json" id="data">\n'+json+'\n<\/script>\n\n<script id="main">'+document.getElementById("main").textContent+'<\/script>\n\n</body></html>';}
async function save(mutate,okText){if(!artifactApi||ui.saving)return;const backup=JSON.stringify(DATA);mutate();ui.saving=true;ui.msg={text:"Đang lưu…"};render();
  try{try{sessionStorage.setItem("vnjob-msg",okText)}catch(e){}
    await artifactApi.publish(buildHtml());}
  catch(err){DATA=JSON.parse(backup);Object.assign(S,DATA.settings);DATA.settings=S;ui.saving=false;try{sessionStorage.removeItem("vnjob-msg")}catch(e){}
    const c=err&&err.code;
    if(c==="conflict"){ui.msg={text:"Trang vừa được cập nhật ở nơi khác, đang tải lại bản mới.",err:true}}
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"){ui.canEdit=false;ui.msg={text:"Tài khoản này chỉ xem được trang, không lưu được thay đổi.",err:true}}
    else if(c==="rate_limited"){ui.msg={text:"Lưu quá nhanh. Chờ khoảng một phút rồi bấm lưu lại.",err:true}}
    else ui.msg={text:"Chưa lưu được ("+(c||"lỗi")+"). Thử lại sau ít phút.",err:true};
    render();}}
try{const m=sessionStorage.getItem("vnjob-msg");if(m){ui.msg={text:m};sessionStorage.removeItem("vnjob-msg");}}catch(e){}
render();
(async()=>{let u=null;try{const c=window.claude;if(c&&c.use){[artifactApi,u]=await Promise.all([c.use("artifact"),c.use("user")]);}}catch(e){}
  let can=false;try{can=!!(artifactApi&&u&&await u.canEdit())}catch(e){}
  ui.canEdit=can;if(route()[0]==="employer")render();})();
setTimeout(()=>{if(ui.canEdit===null){ui.canEdit=false;if(route()[0]==="employer")render()}},11000);
})();
</script>
</body>
</html>
