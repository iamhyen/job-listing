<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOB LISTING – Việc làm Hà Nội, Quảng Ninh, Hải Phòng</title>
<meta name="description" content="Khám phá việc làm, mở ra cơ hội mới tại đây. Việc làm cập nhật thường xuyên ở Hà Nội, Quảng Ninh, Hải Phòng.">
<meta property="og:title" content="JOB LISTING">
<meta property="og:description" content="Việc làm được cập nhật thường xuyên ở Hà Nội, Quảng Ninh, Hải Phòng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: thanh điều hướng + dải tìm kiếm màu biển; trang chủ (ngành nghề, việc nổi bật, nhà tuyển dụng), trang kết quả có bộ lọc bên trái, trang chi tiết 2 cột, trang nhà tuyển dụng để đăng tin */
:root{
  --bg:#f2f5f5; --surface:#ffffff; --fg:#13262a; --muted:#5b6e72; --line:#d9e2e2;
  --accent:#0b6b6b; --accent-2:#0a5555; --accent-ink:#ffffff; --accent-soft:#dcefed; --warm:#c45f1c; --warm-soft:#fbeadc;
  --display:"Lexend",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e191a; --surface:#152325; --fg:#e3eded; --muted:#99adaf; --line:#253839;
  --accent:#49bfb4; --accent-2:#0f3b3a; --accent-ink:#04201d; --accent-soft:#163836; --warm:#f2a35f; --warm-soft:#3a2615; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191a; --surface:#152325; --fg:#e3eded; --muted:#99adaf; --line:#253839;
  --accent:#49bfb4; --accent-2:#0f3b3a; --accent-ink:#04201d; --accent-soft:#163836; --warm:#f2a35f; --warm-soft:#3a2615; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:21px;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:34px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:15px}
.nav nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav nav a{text-decoration:none;padding:6px 12px;border-radius:6px;font-weight:500;font-size:14.5px;color:var(--muted)}
.nav nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#c0392b;border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
/* hero */
.hero{background:var(--accent-2);color:#fff}
:root:not([data-theme="dark"]) .hero{background:var(--accent-2)}
.hero .wrap{padding-block:40px 44px;display:grid;gap:14px}
.hero h1{font-family:var(--display);font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0;text-wrap:balance;color:#fff}
.hero p{margin:0;color:#cfe6e4;max-width:60ch}
.search{display:grid;grid-template-columns:1fr 220px auto;gap:8px;background:var(--surface);padding:8px;border-radius:12px;margin-top:6px}
.search input,.search select{border:0;background:transparent;padding:10px 12px;min-width:0;color:var(--fg)}
.search select{border-left:1px solid var(--line)}
.search .btn{padding-inline:22px}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:#cfe6e4}
.stats b{color:#fff;font-family:var(--display);font-size:18px;margin-right:4px;font-variant-numeric:tabular-nums}
/* sections */
main{min-height:60vh}
.section{padding-block:30px;display:grid;gap:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.25}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:14px;background:none;border:0;cursor:pointer;padding:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.cat b{font-weight:600}
.cat span{font-size:13px;color:var(--muted)}
.cat:hover{border-color:var(--accent)}
.grid-jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:52px 1fr;gap:14px;text-decoration:none;align-items:start;position:relative}
.card:hover{border-color:var(--accent)}
.logo{width:52px;height:52px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;background:var(--accent-soft);color:var(--accent)}
.card-body{min-width:0;display:grid;gap:3px}
.card h3{font-size:16px;margin:0;line-height:1.35;font-weight:600}
.company{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12.5px;padding:2px 9px;border-radius:5px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.salary{background:var(--warm-soft);color:var(--warm);border-color:transparent;font-weight:600;font-variant-numeric:tabular-nums}
.badge-hot{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warm)}
.emps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.emp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.emp div{min-width:0}
.emp b{display:block;font-size:14.5px;line-height:1.35}
.emp span{font-size:13px;color:var(--muted)}
/* results */
.results{display:grid;grid-template-columns:250px 1fr;gap:22px;padding-block:24px 40px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px;position:sticky;top:76px}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}
.filters legend{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.filters label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.list{display:grid;gap:10px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list-head select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:32px;text-align:center;color:var(--muted)}
/* detail */
.crumb{font-size:13.5px;color:var(--muted);padding-top:18px}
.crumb a{color:var(--accent);text-decoration:none}
.detail{display:grid;grid-template-columns:1fr 320px;gap:22px;padding-block:14px 40px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.job-title{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center}
.job-title .logo{width:64px;height:64px;font-size:20px}
.job-title h1{font-family:var(--display);font-size:clamp(21px,3.5vw,27px);margin:0;line-height:1.25;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;border-block:1px solid var(--line);padding-block:14px}
.facts div{display:grid}
.facts small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts b{font-weight:600;font-variant-numeric:tabular-nums}
.facts .money{color:var(--warm)}
.panel h3{font-size:16px;margin:0;font-family:var(--display);font-weight:600}
.panel ul{margin:0;padding-left:20px;display:grid;gap:4px}
.apply-sec{border-top:2px solid var(--accent);padding-top:18px;margin-top:6px;display:grid;gap:12px;scroll-margin-top:80px}
.apply-sec h2{font-size:20px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.copy-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copy-row b{min-width:0;overflow-wrap:anywhere;flex:1}
.copy-row .note{width:56px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}
.privacy{font-size:13px;line-height:1.55;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.privacy b{color:var(--fg);font-weight:600}
.quick-box{border:2px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:18px;display:grid;gap:12px;scroll-margin-top:80px}
.quick-box h2{font-size:22px}
.quick-box .lead{margin:0;font-size:15.5px}
.qf{display:grid;gap:12px}
.qf label{display:grid;gap:6px;font-size:15px;font-weight:600;color:var(--fg)}
.qf input,.qf select{font-size:17px;min-height:50px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.qf .btn{min-height:54px;font-size:17px}
.qf-err{color:#c0392b;font-weight:600;margin:0}
.qf-ok{background:var(--surface);border-radius:10px;padding:16px;display:grid;gap:6px;text-align:center}
.qf-ok b{font-size:19px;font-family:var(--display);color:var(--accent)}
.pill.nocv{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.worker{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:18px;display:grid;gap:12px}
.worker h2{font-size:21px}
.worker p{margin:0;color:var(--muted)}
.worker .areas{display:flex;gap:10px;flex-wrap:wrap}
.worker .areas a{flex:1 1 150px;text-align:center;min-height:52px;font-size:16px}
.btn.big{padding:12px 26px;font-size:15.5px}
.side{display:grid;gap:14px;position:sticky;top:76px}
.note{font-size:13px;color:var(--muted);margin:0}
form.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
form.grid .full{grid-column:1/-1}
.fld{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14.5px;min-width:0;width:100%}
.fld.check{display:flex;align-items:center;gap:8px;color:var(--fg)}
.fld.check input{width:auto}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;margin:0;font-family:var(--body);font-size:14px;user-select:all}
.alert{padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:14px}
.alert.err{background:var(--warm-soft)}
.mini-list{display:grid;gap:8px}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.mini div{min-width:0}
.mini b{display:block;font-size:14.5px}
.mini span{font-size:13px;color:var(--muted)}
.mini .acts{display:flex;gap:6px}
footer{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sample{font-size:12.5px;background:var(--warm-soft);color:var(--warm);padding:6px 0;text-align:center;font-weight:500}
.filter-toggle{display:none}
@media (max-width:860px){
  .results,.detail{grid-template-columns:1fr}
  .filters,.side{position:static}
  .filter-toggle{display:inline-flex}
  .filters[data-collapsed="true"]{display:none}
}
@media (max-width:620px){
  .search{grid-template-columns:1fr}
  .search select{border-left:0;border-top:1px solid var(--line)}
  .grid-jobs{grid-template-columns:1fr}
  form.grid{grid-template-columns:1fr}
}
@media (max-width:860px){.detail,.results{grid-template-columns:minmax(0,1fr)}.job-title>div{min-width:0}.job-title .company{white-space:normal}}
@media (max-width:620px){.nav{position:static}.nav .wrap{gap:8px;padding-block:8px}.nav .btn.warm{display:none}.nav nav{flex-basis:100%;order:3;flex-wrap:nowrap;overflow-x:auto}.nav nav a{white-space:nowrap}.brand{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .2s ease-out}@keyframes fade{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script id="main">

const daysLeft=d=>Math.round((new Date(d+"T00:00:00")-today)/864e5);
const fmtDate=d=>{const [y,m,dd]=d.split("-");return dd+"/"+m+"/"+y};

const active=()=>DATA.jobs.filter(j=>daysLeft(j.deadline)>=0);

function filtered(){

function checks(name,opts,sel){return opts.map(o=>`<label><input type="checkbox" name="${name}" value="${esc(o)}" ${sel.includes(o)?"checked":""}> ${esc(o)}</label>`).join("")}
function jobs(){

function quickForm(j){return `<form class="qf" id="quickForm" data-id="${esc(j.id)}" novalidate>

   <label>Khu vực muốn làm<select id="q-area" name="area">${["Hà Nội","Hải Phòng","Quảng Ninh"].map(a=>`<option ${a===j.location?"selected":""}>${a}</option>`).join("")}</select></label>

async function sendQuick(f){
  const QF=S.quickForm||{},err=f.querySelector("#qfErr"),btn=f.querySelector("button");
  const name=f.name.value.trim(),year=f.year.value.trim(),phone=f.phone.value.replace(/[\s.\-]/g,""),area=f.area.value;
  const cur=new Date().getFullYear();let msg="";
  if(name.length<2)msg="Vui lòng nhập họ và tên.";
  else if(!/^\d{4}$/.test(year)||+year<cur-70||+year>cur-15)msg="Năm sinh chưa đúng, ví dụ: 1998.";
  else if(!/^(\+?84|0)\d{9,10}$/.test(phone))msg="Số điện thoại chưa đúng, ví dụ: 0912345678.";
  if(msg){err.textContent=msg;err.hidden=false;return}
  err.hidden=true;btn.disabled=true;btn.textContent="Đang gửi…";
  const body=new URLSearchParams();body.append(QF.area,area);body.append(QF.name,name);body.append(QF.year,year);body.append(QF.phone,phone);
  try{await fetch(QF.action,{method:"POST",mode:"no-cors",body});
    document.getElementById("qfWrap").innerHTML=`<div class="qf-ok" role="status"><b>Đã gửi thông tin!</b><span>Cảm ơn ${esc(name)}. Bộ phận tuyển dụng sẽ gọi cho bạn qua số ${esc(phone)} trong thời gian sớm nhất.</span></div>`;}
  catch(e){btn.disabled=false;btn.textContent="Gửi thông tin";
    err.innerHTML=`Không gửi được từ trang này. <a href="${esc(QF.view)}" target="_blank" rel="noopener">Bấm vào đây để mở form ứng tuyển</a>.`;err.hidden=false;}}

function jobForm(j){j=j||{};const opt=(arr,v)=>arr.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("");const lines=a=>esc((a||[]).join("\n"));

function saveJob(f){const d=new FormData(f),num=k=>{const v=String(d.get(k)||"").trim();return v===""?null:+v},arr=k=>String(d.get(k)||"").split("\n").map(s=>s.trim()).filter(Boolean);

async function save(mutate,okText){if(!artifactApi||ui.saving)return;const backup=JSON.stringify(DATA);mutate();ui.saving=true;ui.msg={text:"Đang lưu…"};render();
  try{try{sessionStorage.setItem("vnjob-msg",okText)}catch(e){}
    await artifactApi.publish(buildHtml());}
  catch(err){DATA=JSON.parse(backup);Object.assign(S,DATA.settings);DATA.settings=S;ui.saving=false;try{sessionStorage.removeItem("vnjob-msg")}catch(e){}
    const c=err&&err.code;
    if(c==="conflict"){ui.msg={text:"Trang vừa được cập nhật ở nơi khác, đang tải lại bản mới.",err:true}}
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"){ui.canEdit=false;ui.msg={text:"Tài khoản này chỉ xem được trang, không lưu được thay đổi.",err:true}}
    else if(c==="rate_limited"){ui.msg={text:"Lưu quá nhanh. Chờ khoảng một phút rồi bấm lưu lại.",err:true}}
    else ui.msg={text:"Chưa lưu được ("+(c||"lỗi")+"). Thử lại sau ít phút.",err:true};
    render();}}
try{const m=sessionStorage.getItem("vnjob-msg");if(m){ui.msg={text:m};sessionStorage.removeItem("vnjob-msg");}}catch(e){}
render();
(async()=>{let u=null;try{const c=window.claude;if(c&&c.use){[artifactApi,u]=await Promise.all([c.use("artifact"),c.use("user")]);}}catch(e){}
  let can=false;try{can=!!(artifactApi&&u&&await u.canEdit())}catch(e){}
  ui.canEdit=can;if(route()[0]==="employer")render();})();
setTimeout(()=>{if(ui.canEdit===null){ui.canEdit=false;if(route()[0]==="employer")render()}},11000);
})();
</script>
</body>
</html>
